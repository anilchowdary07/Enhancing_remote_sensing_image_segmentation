# EADF-Net Configuration for FGGS dataset

# === Dataset ===
dataset: fggs
data_root: ./data/FGGS  # Change to your dataset path
crop_size: 256
num_workers: 4

# === Model ===
backbone: efficientnet_b1
pretrained: true
num_classes: 5

# === Training ===
epochs: 100
freeze_epochs: 50
batch_size: 4
lr: 0.0005
optimizer: adam
weight_decay: 0.0001
scheduler: cosine_annealing
eta_min: 0.000001

# === Loss Weights ===
lambda_focal: 1.0
lambda_lovasz: 0.5
lambda_boundary: 0.3
lambda_aux: 0.4
gamma: 2.0

# === Enhancement ===
use_amp: true
use_ema: true
ema_decay: 0.999
grad_clip: 1.0

# === Data Augmentation ===
augmentation:
  random_scale: [0.75, 1.5]
  random_flip: true
  random_rotation: [-15, 15]
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2

# === Saving ===
save_dir: ./checkpoints/fggs
log_interval: 50
seed: 42
